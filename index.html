<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --border: #e3ded6; --hover: #1d1d1f; --hover-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1f1f1f; --text: #f2f2f2; --muted: #a0a0a5;
      --border: #2e2e2e; --hover: #f2f2f2; --hover-text: #141414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 64px 16px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--card); box-shadow: 0 2px 12px rgba(0,0,0,.12);
  }
  h1 { font-size: 1.5rem; margin: 16px 0 4px; }
  .bio { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; border-radius: 14px; background: var(--card);
    border: 1px solid var(--border); color: var(--text);
    text-decoration: none; font-weight: 600;
    transition: background .15s, color .15s, transform .15s;
  }
  a.link:hover, a.link:focus-visible {
    background: var(--hover); color: var(--hover-text); transform: translateY(-2px);
  }
  a.link svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  footer { margin-top: 40px; color: var(--muted); font-size: .8rem; }
</style>
